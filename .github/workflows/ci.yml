name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Points at the Postgres service defined above. Throwaway: it exists only for this run.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      # Throwaway values for this run only; they protect nothing.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
      # The local S3-compatible server started below (the e2e job only builds, so it
      # needs the settings but no running server). A well-known login, not a secret.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: bookshop
      STORAGE_ACCESS_KEY_ID: localdev
      STORAGE_SECRET_ACCESS_KEY: localdev-secret
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: 'true'
      IMAGE_BASE_URL: http://127.0.0.1:9000/bookshop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm, Node and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true

      # A throwaway S3-compatible server for the storage tests, the same image and
      # login as docker-compose.yml. A service container cannot take the start
      # command, so it is started here.
      - name: Start the local photo storage
        run: |
          docker run -d --name storage -p 127.0.0.1:9000:8333 \
            -v "$PWD/docker/storage/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 1
          done
          docker logs storage
          exit 1

      - run: pnpm db:ping
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway database for this run. The home page queries it, so it gets
      # the real migrations. Playwright seeds the invented data itself (e2e/global-setup.ts).
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      # Throwaway values for this run only; they protect nothing.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
      # The local S3-compatible server started below, for the photo upload in the
      # admin flow. A well-known login, not a secret.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: bookshop
      STORAGE_ACCESS_KEY_ID: localdev
      STORAGE_SECRET_ACCESS_KEY: localdev-secret
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: 'true'
      IMAGE_BASE_URL: http://127.0.0.1:9000/bookshop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm, Node and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true

      # A throwaway S3-compatible server for the photo upload, the same image and
      # login as docker-compose.yml. A service container cannot take the start
      # command, so it is started here.
      - name: Start the local photo storage
        run: |
          docker run -d --name storage -p 127.0.0.1:9000:8333 \
            -v "$PWD/docker/storage/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/ || true)
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 1
          done
          docker logs storage
          exit 1

      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
