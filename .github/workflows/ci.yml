name: CI

# CI runs on pull requests, not again after the merge (ADR 0020). The rulesets on
# main require `check` and `e2e`, with "branch must be up to date": what reaches
# main has passed on a tree that already contained main, so a post-merge run
# would repeat it. The weekly run below catches drift (an image tag, Node 24).
on:
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless. Scheduled
# runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Probed every second: the job starts as soon as Postgres answers, not at
        # the next 5 s tick. 30 tries keep the same patience on a slow runner.
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      # Points at the Postgres service defined above. Throwaway: it exists only for this run.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      # Throwaway values for this run only; they protect nothing.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
      # The local S3-compatible server started below (the e2e job only builds, so it
      # needs the settings but no running server). A well-known login, not a secret.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: bookshop
      STORAGE_ACCESS_KEY_ID: localdev
      STORAGE_SECRET_ACCESS_KEY: localdev-secret
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: 'true'
      IMAGE_BASE_URL: http://127.0.0.1:9000/bookshop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm, Node and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true

      # A throwaway S3-compatible server for the storage tests, the same image and
      # login as docker-compose.yml. A service container cannot take the start
      # command, so it is started here.
      - name: Start the local photo storage
        run: |
          docker run -d --name storage -p 127.0.0.1:9000:8333 \
            -v "$PWD/docker/storage/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          # Ready when the S3 gateway's own /status answers 2xx. Not "any reply":
          # a half-started server answers with errors too. Polled twice a second.
          for _ in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/status; then exit 0; fi
            sleep 0.5
          done
          docker logs storage
          exit 1

      - run: pnpm db:ping
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      # No `pnpm build` here: the e2e job below builds the production app (its
      # Playwright config runs `pnpm build && pnpm start` in CI), and Vercel
      # builds it again on every pull request. If e2e ever becomes conditional,
      # build here too.

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Probed every second: the job starts as soon as Postgres answers, not at
        # the next 5 s tick. 30 tries keep the same patience on a slow runner.
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway database for this run. The home page queries it, so it gets
      # the real migrations. Playwright seeds the invented data itself (e2e/global-setup.ts).
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      # Throwaway values for this run only; they protect nothing.
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      BETTER_AUTH_URL: http://localhost:3000
      # The local S3-compatible server started below, for the photo upload in the
      # admin flow. A well-known login, not a secret.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_BUCKET: bookshop
      STORAGE_ACCESS_KEY_ID: localdev
      STORAGE_SECRET_ACCESS_KEY: localdev-secret
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: 'true'
      IMAGE_BASE_URL: http://127.0.0.1:9000/bookshop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm, Node and dependencies
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true

      # A throwaway S3-compatible server for the photo upload, the same image and
      # login as docker-compose.yml. A service container cannot take the start
      # command, so it is started here.
      - name: Start the local photo storage
        run: |
          docker run -d --name storage -p 127.0.0.1:9000:8333 \
            -v "$PWD/docker/storage/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 \
            server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          # Ready when the S3 gateway's own /status answers 2xx. Not "any reply":
          # a half-started server answers with errors too. Polled twice a second.
          for _ in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/status; then exit 0; fi
            sleep 0.5
          done
          docker logs storage
          exit 1

      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
