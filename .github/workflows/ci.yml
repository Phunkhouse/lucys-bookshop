name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Dummy value: the build only needs the variable to exist.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm, Node and dependencies
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
