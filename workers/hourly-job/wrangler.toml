# The Cloudflare Worker that calls the shop's hourly job (see docs/hourly-job.md).
# Only for deploying with wrangler; pasting index.js into the dashboard needs
# none of this. Nothing about the shop belongs here: SHOP_URL and JOBS_SECRET are
# set on the Worker itself, as secrets (`wrangler secret put`).
name = "lucys-bookshop-hourly-job"
main = "index.js"
compatibility_date = "2026-10-01"
# No public workers.dev address for this Worker: it has nothing to show a visitor.
# (The account still needs a workers.dev subdomain once, or Cloudflare refuses the
# cron trigger: see docs/hourly-job.md.)
workers_dev = false

# Keep the Worker's log lines (including each cron run and "hourly job: {...}")
# in the dashboard, under the Worker's Observability tab. The free plan allows
# 200,000 events a day and keeps them for 3 days; this Worker writes a few a day.
[observability]
enabled = true

[triggers]
# Every hour at minute 17, UTC. Not on the hour: scheduled runs are most often
# delayed at the start of an hour.
crons = ["17 * * * *"]
