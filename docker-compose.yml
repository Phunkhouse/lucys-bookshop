services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - bookshop_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for Cloudflare R2 (an S3-compatible server). Photos are
  # uploaded here during development and in tests. The login in s3.json is a
  # well-known local default, not a secret; anonymous visitors may read, like the
  # public R2 address.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - '127.0.0.1:9000:8333'
    volumes:
      - ./docker/storage/s3.json:/etc/seaweedfs/s3.json:ro
      - bookshop_storage:/data

  # Creates the local photo bucket once, then stops.
  storage-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - storage
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: localdev
      AWS_SECRET_ACCESS_KEY: localdev-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until aws --endpoint-url http://storage:8333 s3 ls >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://storage:8333 s3 mb s3://bookshop || true

volumes:
  bookshop_pgdata:
  bookshop_storage:
